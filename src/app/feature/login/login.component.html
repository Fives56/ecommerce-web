<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8">
          <h1 class="text-2xl font-bold text-white text-center">Welcome Back</h1>
          <p class="text-blue-100 text-center mt-2">Sign in to your account</p>
        </div>

        <!-- Form -->
        <div class="p-8">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <!-- username -->
            <div class="mb-6">
              <label class="block text-gray-700 text-sm font-medium mb-2">
                Username
              </label>
              <input 
                type="username" 
                formControlName="username"
                placeholder="username"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                [class.border-red-500]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
              
              @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
                <div class="text-red-600 text-sm mt-1">
                  Please enter a valid username
                </div>
              }
            </div>

            <!-- Password -->
            <div class="mb-6">
              <label class="block text-gray-700 text-sm font-medium mb-2">
                Password
              </label>
              <input 
                type="password" 
                formControlName="password"
                placeholder="Enter your password"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              
              @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                <div class="text-red-600 text-sm mt-1">
                  Password is required
                </div>
              }
            </div>

            <!-- Submit Button -->
            <button 
              type="submit"
              [disabled]="isLoading() || loginForm.invalid"
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-medium py-3 px-4 rounded-lg hover:opacity-90 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
              
              @if (isLoading()) {
                <div class="flex items-center justify-center gap-2">
                  <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  <span>Signing in...</span>
                </div>
              } @else {
                Sign In
              }
            </button>
          </form>
        </div>
      </div>
    </div>
